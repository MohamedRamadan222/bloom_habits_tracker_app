name: bloom_habit_tracker
description: "A local-first habit tracker built with Flutter, Cubit and Hive."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.22
  gap: ^3.0.1
  intl: ^0.20.3
  uuid: ^4.6.0
  flutter_bloc: ^9.1.1
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  get_it: ^9.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope/Manrope-ExtraBold.ttf
          weight: 800

  # --- App icon (Phase 5.4) ---
  # Source must be >=512px, ideally 1024x1024 PNG.
  # assets/icons/appBarIcon.png is only 937B -> replace with
  # assets/icons/app_icon.png before running.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

  # --- Splash (Phase 5.4) ---
flutter_native_splash:
  color: "#EEE9F8"
  image: "assets/icons/app_icon.png"
  android_12:
    color: "#EEE9F8"
    image: "assets/icons/app_icon.png"